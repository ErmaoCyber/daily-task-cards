spring:
  application:
    name: daily-task-cards-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:daybyday}
    username: ${POSTGRES_USER:daybyday}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
